# openimages.cloud: IPv6 SLAAC. OpenStack (Infomaniak) assigns the IPv6
# address through router advertisements, not DHCPv6; accept them on every
# interface so the kernel configures the EUI-64 address Neutron expects.
net.ipv6.conf.all.accept_ra = 1
net.ipv6.conf.default.accept_ra = 1
net.ipv6.conf.all.autoconf = 1
net.ipv6.conf.default.autoconf = 1
